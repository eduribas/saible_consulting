name: saible_consulting_core
description: "Country data, fuzzy search and 40 locales shared by the saible_consulting form field packages"
version: 1.0.4
repository: https://github.com/saible-app/saible_consulting
issue_tracker: https://github.com/saible-app/saible_consulting/issues

topics:
  - flutter
  - countries
  - localization
  - search
  - date

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Required by the generated `l10n/app_localizations.dart`, which imports
  # `flutter_localizations` for its legacy `localizationsDelegates` list
  # (`GlobalMaterialLocalizations`, `GlobalCupertinoLocalizations` and
  # `GlobalWidgetsLocalizations`). Apps on `material_ui` should spread
  # `SaibleLocalizations.localizationsDelegates` into `MaterialApp` instead and
  # can ignore that generated list entirely.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  material_ui: ^1.6.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# The following section is specific to Flutter packages.
flutter:
  generate: true

resolution: workspace
