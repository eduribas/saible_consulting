name: country_picker_form_field
description: "Searchable country picker form field with fuzzy search over 249 countries, flag emojis and 39 languages"
version: 1.0.2
repository: https://github.com/saible-app/saible_consulting
issue_tracker: https://github.com/saible-app/saible_consulting/issues

topics:
  - flutter
  - country
  - form
  - localization
  - search

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.6.0
  provider: ^6.1.5+1
  saible_consulting_core: ^1.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
